<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM · Аналитика сделок</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-bar"></span><span class="brand-bar"></span><span class="brand-bar"></span>
        </div>
        <div class="brand-text">
          <h1>Аналитика CRM</h1>
          <p class="brand-sub">Воронка и сводка по сделкам</p>
        </div>
      </div>
      <div class="user" id="userBox" hidden>
        <span class="user-label">Портал</span>
        <span class="user-name" id="userName"></span>
        <span class="user-role" id="userRole"></span>
      </div>
    </header>

    <section class="period-bar" aria-label="Фильтр по периоду">
      <div class="period-presets" id="presetButtons" role="tablist" aria-label="Пресеты периода">
        <button class="chip" data-preset="7d" role="tab">7 дней</button>
        <button class="chip" data-preset="30d" role="tab" aria-selected="true">30 дней</button>
        <button class="chip" data-preset="90d" role="tab">90 дней</button>
        <button class="chip" data-preset="this_month" role="tab">Этот месяц</button>
      </div>
      <div class="period-custom">
        <label class="field">
          <span>с</span>
          <input type="date" id="dateFrom">
        </label>
        <label class="field">
          <span>по</span>
          <input type="date" id="dateTo">
        </label>
        <button class="btn" id="applyCustom">Применить</button>
      </div>
      <button class="btn btn-ghost" id="refreshBtn" title="Обновить данные">Обновить</button>
    </section>

    <section class="status-line" id="statusLine" hidden></section>

    <main>
      <section class="kpi-grid" id="kpiGrid" aria-label="Ключевые показатели">
        <article class="kpi open">
          <div class="kpi-label">Открытые сделки за период</div>
          <div class="kpi-value" id="kpiOpenSum">—</div>
          <div class="kpi-note" id="kpiOpenNote"></div>
        </article>
        <article class="kpi won">
          <div class="kpi-label">Выиграно за период</div>
          <div class="kpi-value" id="kpiWonCount">—</div>
          <div class="kpi-note" id="kpiWonNote"></div>
        </article>
        <article class="kpi avg">
          <div class="kpi-label">Средний чек выигранных</div>
          <div class="kpi-value" id="kpiAvg">—</div>
          <div class="kpi-note" id="kpiAvgNote"></div>
        </article>
      </section>

      <section class="panels">
        <article class="panel funnel">
          <header class="panel-head">
            <h2>Сводка по стадиям</h2>
            <span class="panel-meta" id="funnelMeta"></span>
          </header>
          <div class="funnel-list" id="funnelList"></div>
        </article>

        <article class="panel recent">
          <header class="panel-head">
            <h2>Последние сделки</h2>
            <span class="panel-meta" id="recentMeta"></span>
          </header>
          <div class="table-wrap">
            <table class="deals" id="dealsTable">
              <thead>
                <tr>
                  <th>Сделка</th>
                  <th class="num">Сумма</th>
                  <th>Стадия</th>
                  <th>Ответственный</th>
                  <th>Создана</th>
                </tr>
              </thead>
              <tbody id="dealsBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>

    <footer class="footer" id="footer"></footer>
  </div>

  <template id="stageRow">
    <div class="stage">
      <div class="stage-head">
        <span class="stage-name"></span>
        <span class="stage-count"></span>
        <span class="stage-sum"></span>
      </div>
      <div class="stage-track"><div class="stage-fill"></div></div>
    </div>
  </template>

  <template id="dealRow">
    <tr>
      <td class="deal-title"><a class="deal-link" target="_blank" rel="noopener"></a></td>
      <td class="num deal-amount"></td>
      <td class="deal-stage"><span class="pill"></span></td>
      <td class="deal-owner"></td>
      <td class="deal-date"></td>
    </tr>
  </template>

  <script src="app.js"></script>
</body>
</html>
